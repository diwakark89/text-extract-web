<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Image only question fixture</title>
  </head>
  <body>
    <div class="exam-row">
      <div class="question-content">
        <p><img src="question.png" alt="question diagram" /></p>
        <ul class="mc-question">
          <li class="mc-option">Option A text</li>
          <li class="mc-option">Option B text</li>
          <li class="mc-option">Option C text</li>
          <li class="mc-option">Option D text</li>
        </ul>
        <div class="correct-answer">Answer(s): B</div>
      </div>
    </div>

    <div class="exam-row">
      <div class="question-content">
        <p>Which storage class has the lowest retrieval latency?</p>
        <ul class="mc-question">
          <li class="mc-option">S3 Glacier Deep Archive</li>
          <li class="mc-option">S3 Standard</li>
          <li class="mc-option">S3 One Zone-IA</li>
          <li class="mc-option">S3 Glacier Flexible Retrieval</li>
        </ul>
        <div class="correct-answer">Answer(s): B</div>
      </div>
    </div>
  </body>
</html>
