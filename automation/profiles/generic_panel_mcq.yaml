question:
  - ".question"
  - ".question-text"
  - "p.lead"
  - "[class*='question'] p"

options:
  - ".options li"
  - "ol > li"
  - "ul > li"
  - ".option"
  - ".ui-selectee"

answer:
  - ".answer"
  - ".correct-answer"
  - "[class*='answer'] p"
  - "div[id*='answer'] p"

show_answer_buttons:
  - "button.show-answer"
  - "a.show-answer"
  - "button[data-toggle='collapse']"
  - "a[data-toggle='collapse'][href*='answer']"
  - "button:has-text('Show Answer')"

next_buttons:
  - "button.next"
  - "a.next"
  - "a:has-text('Next Question')"
  - "button:has-text('Next')"
  - "a:has-text('Next')"
