question:
  - "p.lead"
  - ".question"
  - ".question-text"
  - "[class*='question'] p"

options:
  - "ol.ui-selectable > li"
  - "ol.rounded-list > li"
  - "ol.rounded-list-multi > li"
  - "ul > li"
  - ".option"
  - ".ui-selectee"

answer:
  - "div[id^='answerQ'] > p"
  - ".answer"
  - ".correct-answer"
  - "[class*='answer'] p"

show_answer_buttons:
  - "a[data-toggle='collapse'][href*='answerQ']"
  - "button[data-toggle='collapse'][data-target*='answerQ']"
  - "button.show-answer"
  - "a.show-answer"

next_buttons:
  - "a[href*='collapse_']"
  - "button[aria-controls*='collapse_']"
  - "a:has-text('Next Question')"
  - "button:has-text('Next')"
  - "a:has-text('Next')"
